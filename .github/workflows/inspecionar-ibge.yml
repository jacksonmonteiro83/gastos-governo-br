name: Inspecionar IBGE

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "--xlsx (projeção 2024) ou --uf (população por UF)"
        default: "--uf"
        required: true

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests pandas openpyxl
      - name: Inspecionar planilhas da projeção 2024
        env:
          MODO: ${{ inputs.modo }}
        run: python -m pipeline.ibge "$MODO" | tee ibge-inspecao.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ibge-inspecao
          path: ibge-inspecao.txt
