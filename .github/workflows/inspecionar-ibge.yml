name: Inspecionar IBGE

on:
  workflow_dispatch:

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - name: Listar arquivos de projeção do IBGE
        run: python -m pipeline.ibge --ftp | tee ibge-inspecao.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ibge-inspecao
          path: ibge-inspecao.txt
