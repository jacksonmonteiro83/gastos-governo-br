name: Atualizar despesas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 6 * *"   # dia 6 de cada mês, 05:00 em Brasília

permissions:
  contents: write

jobs:
  despesas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restaurar cache dos ZIPs anuais
        uses: actions/cache/restore@v4
        with:
          path: data/raw/orcamento_despesa
          key: despesas-${{ github.run_id }}
          restore-keys: despesas-
      - run: python -m pipeline.bcb                          # IPCA para corrigir os valores
      - run: python -m pipeline.transparencia --tudo         # baixa 2014 até hoje e consolida
      - name: Salvar cache dos ZIPs anuais
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/orcamento_despesa
          key: despesas-${{ github.run_id }}
      - run: python -m pipeline.agregar_despesas
      - name: Publicar dados do painel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/despesas_data.js
          git diff --cached --quiet || (git commit -m "Atualiza dados das despesas" && git pull --rebase && git push)
      # dbt por último: uma falha nele não impede a publicação dos dados acima.
      - run: make build-despesas
      - name: Conferir dbt x painel
        run: make conferir-despesas
