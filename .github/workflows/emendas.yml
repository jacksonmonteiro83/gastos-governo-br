name: Atualizar emendas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 7 * *"   # dia 7 de cada mês, 06:00 em Brasília

permissions:
  contents: write

jobs:
  emendas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline.bcb                  # IPCA para corrigir os valores
      - run: python -m pipeline.emendas --tudo       # baixa o arquivo único (todos os anos) e consolida
      - run: python -m pipeline.populacao_uf         # população por UF (IBGE) para o valor por habitante
      - run: python -m pipeline.agregar_emendas
      - name: Publicar dados do painel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/emendas_data.js
          git diff --cached --quiet || (git commit -m "Atualiza dados das emendas" && git pull --rebase && git push)
      # dbt por último: uma falha nele não impede a publicação dos dados acima.
      - run: make build-emendas
      - name: Conferir dbt x painel
        run: make conferir-emendas
