name: Atualizar dados

on:
  schedule:
    - cron: "0 6 * * *"   # 03:00 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: make ingest
      - run: python -m pipeline.agregar
      - name: Publicar dados do dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.js
          git diff --cached --quiet || (git commit -m "Atualiza dados do dashboard" && git pull --rebase && git push)
      # dbt por último: uma falha nele não impede a publicação dos dados acima.
      - run: make build
