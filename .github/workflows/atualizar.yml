name: Atualizar dados

on:
  schedule:
    - cron: "0 6 * * *"   # 03:00 em Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: make ingest
      - run: make build
      # Publicar o resultado (ex.: exportar JSON/Parquet para dashboard/data)
      # e fazer commit fica para quando o dashboard existir.
