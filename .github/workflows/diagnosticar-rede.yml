name: Diagnosticar rede

on:
  workflow_dispatch:

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m pipeline.diagnosticar_rede | tee diagnostico_rede.txt
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostico-rede
          path: diagnostico_rede.txt
