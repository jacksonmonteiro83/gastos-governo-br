name: Inspecionar dados do Tesouro

on:
  workflow_dispatch:

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Baixar e inspecionar a série histórica
        run: python -m pipeline.tesouro --inspecionar | tee inspecao.txt
      - uses: actions/upload-artifact@v4
        with:
          name: tesouro-serie-historica
          path: |
            inspecao.txt
            data/raw/tesouro_serie_historica.xlsx
