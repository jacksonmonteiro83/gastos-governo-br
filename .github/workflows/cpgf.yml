name: Atualizar CPGF

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 5 * *"   # dia 5 de cada mês, 04:00 em Brasília

permissions:
  contents: write

jobs:
  cpgf:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cache dos ZIPs mensais
        uses: actions/cache@v4
        with:
          path: data/raw/cpgf
          key: cpgf-${{ github.run_id }}
          restore-keys: cpgf-
      - run: python -m pipeline.bcb          # IPCA para corrigir os valores
      - run: python -m pipeline.cpgf --tudo  # baixa 2013 até hoje e consolida
      - run: python -m pipeline.agregar_cpgf
      - name: Publicar dados do painel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cpgf_data.js
          git diff --cached --quiet || (git commit -m "Atualiza dados do CPGF" && git pull --rebase && git push)
