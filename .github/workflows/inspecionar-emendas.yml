name: Inspecionar emendas

on:
  workflow_dispatch:

jobs:
  inspecionar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Baixar e inspecionar
        run: python -m pipeline.emendas --inspecionar | tee inspecao_emendas.txt
      - uses: actions/upload-artifact@v4
        with:
          name: emendas-inspecao
          path: inspecao_emendas.txt
